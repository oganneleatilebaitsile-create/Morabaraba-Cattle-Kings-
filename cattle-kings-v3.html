
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101710">
<title>Morabaraba: Cattle Kings V3</title>

<style>
:root {
  --bg:#101710;
  --panel:#1c291e;
  --gold:#e8b84f;
  --red:#e85c54;
  --blue:#64b9ed;
  --text:#f7f4e9;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
header{text-align:center;padding:20px 10px}
h1{color:var(--gold);margin:0}
header p{color:#a8b4a4;font-size:13px}
main{max-width:600px;margin:auto;padding:12px}
.panel{
  background:var(--panel);
  border:1px solid #39483a;
  border-radius:14px;
  padding:14px;
  margin-bottom:13px;
}
.score{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.player{
  background:#253328;
  padding:12px;
  text-align:center;
  border:2px solid transparent;
  border-radius:10px;
}
.player.active{border-color:var(--gold)}
.player strong{display:block;margin:8px}
.dot{
  display:inline-block;
  width:13px;height:13px;
  border-radius:50%;
  margin-right:5px;
}
.red{background:var(--red)}
.blue{background:var(--blue)}
#status{
  color:var(--gold);
  text-align:center;
  font-weight:bold;
  margin:16px 0 8px;
}
#message{
  text-align:center;
  color:#b5c0b2;
  font-size:13px;
}
.board-wrap{width:100%;max-width:520px;margin:auto}
svg{
  width:100%;
  display:block;
  background:#18251a;
  border-radius:12px;
}
.line{
  stroke:#d6b96e;
  stroke-width:3;
  fill:none;
}
.point{
  stroke:#f4d99a;
  stroke-width:2;
  cursor:pointer;
}
.empty{fill:#344638}
.redpiece{fill:var(--red)}
.bluepiece{fill:var(--blue)}
.selected{
  stroke:white;
  stroke-width:6;
}
.controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}
button{
  flex:1;
  min-width:100px;
  padding:13px;
  border:0;
  border-radius:8px;
  background:var(--gold);
  color:#17170e;
  font-weight:bold;
  cursor:pointer;
}
.secondary{
  background:#344638;
  color:white;
}
footer{
  text-align:center;
  color:#819080;
  font-size:11px;
  padding:15px;
}
</style>
</head>

<body>

<header>
  <h1>🐄 CATTLE KINGS V3</h1>
  <p>MORABARABA • AFRICAN STRATEGY GAMING</p>
</header>

<main>

<section class="panel">
  <div class="score">
    <div class="player active" id="redCard">
      <span class="dot red"></span> RED
      <strong id="redCount">12 cattle</strong>
      <small id="redPlaced">0 placed</small>
    </div>

    <div class="player" id="blueCard">
      <span class="dot blue"></span> BLUE
      <strong id="blueCount">12 cattle</strong>
      <small id="bluePlaced">0 placed</small>
    </div>
  </div>

  <div id="status">Red's turn • Place a cow</div>
  <p id="message">Place your cattle on an empty intersection.</p>
</section>

<section class="panel">
  <div class="board-wrap">
    <svg viewBox="0 0 600 600" id="board">

      <g class="line">
        <rect x="60" y="60" width="480" height="480"/>
        <rect x="140" y="140" width="320" height="320"/>
        <rect x="220" y="220" width="160" height="160"/>

        <path d="
          M300 60 V220
          M540 300 H380
          M300 540 V380
          M60 300 H220
        "/>
      </g>

      <g id="points"></g>
    </svg>
  </div>
</section>

<section class="panel">
  <div class="controls">
    <button onclick="newGame()">New Game</button>
    <button class="secondary" onclick="toggleLanguage()" id="language">
      Setswana
    </button>
    <button class="secondary" onclick="showRules()">Rules</button>
  </div>

  <div class="controls">
    <button class="secondary" onclick="cancelSelection()">
      Cancel Selection
    </button>
  </div>

  <p id="captureInfo"></p>
</section>

<footer>
  Cattle Kings V3 • Practice mode only • No real-money betting
</footer>

</main>

<script>

const coords = [
 [60,60],[300,60],[540,60],[540,300],
 [540,540],[300,540],[60,540],[60,300],
 [140,140],[300,140],[460,140],[460,300],
 [460,460],[300,460],[140,460],[140,300],
 [220,220],[300,220],[380,220],[380,300],
 [380,380],[300,380],[220,380],[220,300]
];

const adjacent = Array.from({length:24},()=>[]);

function connect(a,b){
 adjacent[a].push(b);
 adjacent[b].push(a);
}

// Three square rings
for(let ring=0;ring<3;ring++){
 const start=ring*8;
 for(let i=0;i<8;i++){
  connect(start+i,start+(i+1)%8);
 }
}

// Connecting lines
for(let i of [1,3,5,7]){
 connect(i,8+i);
 connect(8+i,16+i);
}

// All possible Morabaraba mills
const mills=[];

for(let ring=0;ring<3;ring++){
 let s=ring*8;
 mills.push(
  [s,s+1,s+2],
  [s+2,s+3,s+4],
  [s+4,s+5,s+6],
  [s+6,s+7,s]
 );
}

for(let i of [1,3,5,7]){
 mills.push([i,8+i,16+i]);
}

let board=Array(24).fill(null);
let current="red";

let placed={red:0,blue:0};
let remaining={red:12,blue:12};

let selected=null;
let phase="placing";
let capture=false;
let gameOver=false;
let language="en";

const $=id=>document.getElementById(id);

function opponent(player){
 return player==="red"?"blue":"red";
}

function hasMill(position,player){
 return mills.some(mill=>
  mill.includes(position) &&
  mill.every(p=>board[p]===player)
 );
}

function canCapture(position,player){
 const enemy=opponent(player);

 const enemies=board
  .map((value,index)=>value===enemy?index:-1)
  .filter(index=>index!==-1);

 const outside=enemies.filter(index=>
  !hasMill(index,enemy)
 );

 if(outside.length===0){
  return enemies.includes(position);
 }

 return outside.includes(position);
}

function draw(){

 $("points").innerHTML="";

 coords.forEach(([x,y],i)=>{

  const circle=document.createElementNS(
   "http://www.w3.org/2000/svg","circle"
  );

  circle.setAttribute("cx",x);
  circle.setAttribute("cy",y);
  circle.setAttribute("r",board[i]?19:13);

  let className="point ";

  if(board[i]==="red")className+="redpiece";
  else if(board[i]==="blue")className+="bluepiece";
  else className+="empty";

  if(selected===i)className+=" selected";

  circle.setAttribute("class",className);
  circle.setAttribute("tabindex","0");

  circle.addEventListener("click",()=>play(i));

  circle.addEventListener("keydown",e=>{
   if(e.key==="Enter"||e.key===" "){
    e.preventDefault();
    play(i);
   }
  });

  $("points").appendChild(circle);
 });

 $("redCount").textContent=remaining.red+" cattle";
 $("blueCount").textContent=remaining.blue+" cattle";

 $("redPlaced").textContent=placed.red+" placed";
 $("bluePlaced").textContent=placed.blue+" placed";

 $("redCard").classList.toggle(
  "active",current==="red"&&!gameOver
 );

 $("blueCard").classList.toggle(
  "active",current==="blue"&&!gameOver
 );

 $("captureInfo").textContent=capture?
  "A mill has formed! Capture an opponent's cow.":"";

 updateStatus();
}

function updateStatus(){

 if(gameOver)return;

 let name=current==="red"?"Red":"Blue";

 if(capture){
  $("status").textContent=
   name+" formed a mill! Capture an opponent's cow.";
 }else if(phase==="placing"){
  $("status").textContent=
   name+"'s turn • Place a cow";
 }else{
  $("status").textContent=
   name+"'s turn • Move a cow";
 }
}

function play(i){

 if(gameOver)return;

 // Capturing
 if(capture){

  if(!canCapture(i,current)){
   $("message").textContent=
    "Choose an eligible opponent cow.";
   return;
  }

  board[i]=null;
  remaining[opponent(current)]--;

  capture=false;
  selected=null;

  checkWin();

  if(!gameOver)nextTurn();

  draw();
  return;
 }

 // Placing cattle
 if(phase==="placing"){

  if(board[i]!==null)return;

  board[i]=current;
  placed[current]++;

  if(hasMill(i,current)){
   capture=true;
  }

  if(placed.red===12&&placed.blue===12){
   phase="moving";
  }

  if(!capture)nextTurn();

  draw();
  return;
 }

 // Selecting cattle to move
 if(selected===null){

  if(board[i]!==current)return;

  selected=i;
  draw();
  return;
 }

 // Select another friendly cow
 if(board[i]===current){
  selected=i;
  draw();
  return;
 }

 if(board[i]!==null)return;

 const flying=remaining[current]===3;

 if(!flying&&!adjacent[selected].includes(i)){
  $("message").textContent=
   "Move to an adjacent empty point.";
  return;
 }

 board[selected]=null;
 board[i]=current;

 selected=null;

 if(hasMill(i,current)){
  capture=true;
 }

 if(!capture)nextTurn();

 draw();
}

function nextTurn(){

 selected=null;
 current=opponent(current);

 if(phase==="moving"&&!hasMove(current)){

  gameOver=true;

  $("status").textContent=
   current.toUpperCase()+" IS BLOCKED! "+
   opponent(current).toUpperCase()+" WINS!";

  $("message").textContent="Congratulations!";

 }
}

function hasMove(player){

 const pieces=board
  .map((v,i)=>v===player?i:-1)
  .filter(i=>i!==-1);

 if(pieces.length===3){
  return board.includes(null);
 }

 return pieces.some(i=>
  adjacent[i].some(j=>board[j]===null)
 );
}

function checkWin(){

 const enemy=opponent(current);

 if(phase==="moving"&&remaining[enemy]<3){

  gameOver=true;

  $("status").textContent=
   current.toUpperCase()+" WINS! 🏆";

  $("message").textContent=
   "Congratulations! You won Cattle Kings!";
 }
}

function newGame(){

 board=Array(24).fill(null);

 current="red";

 placed={red:0,blue:0};
 remaining={red:12,blue:12};

 selected=null;
 phase="placing";
 capture=false;
 gameOver=false;

 $("message").textContent=
  "Red starts. Place your cattle.";

 draw();
}

function cancelSelection(){

 if(selected!==null){
  selected=null;
  draw();
 }
}

function toggleLanguage(){

 language=language==="en"?"tn":"en";

 $("language").textContent=
  language==="en"?"Setswana":"English";

 $("message").textContent=
  language==="en"?
  "Place your cattle on an empty intersection.":
  "Baya dikgomo mo mafelong a a senang dikgomo.";

}

function showRules(){

 alert(
  "MORABARABA RULES\n\n"+
  "1. Each player starts with 12 cattle.\n"+
  "2. Place cattle alternately.\n"+
  "3. Form a mill with three cattle in a row.\n"+
  "4. Capture an eligible opponent cow when a mill forms.\n"+
  "5. After placing all cattle, move to adjacent empty points.\n"+
  "6. With three cattle remaining, a player may fly to any empty point.\n"+
  "7. Reduce your opponent to two cattle or block all moves to win."
 );
}

newGame();

</script>

</body>
  </html>
